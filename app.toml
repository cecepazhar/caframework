[app]
name = "CAFramework"
slug = "caframework"
bundle_id = "com.fathforce.caframework"
version = "0.1.0-dev"
accent_color = "indigo"
error_prefix = "CAF"
description = "Privacy-first modular application starter framework"
brand = "CAFramework"

[window]
title = "CAFramework"
width = 1200
height = 800
min_width = 360
min_height = 500

[security]
master_password_required = true
profile_pin_enabled = true

[modules]
sample_slice_enabled = true
ai_assistant_enabled = true
pro_licensing_enabled = true
updater_enabled = true
crash_reporting_enabled = true
backup_restore_enabled = true

[roles]
default_role = "member"
allowed_roles = ["owner", "partner", "member", "child"]

[[menus]]
key = "dashboard"
label = "Dashboard"
href = "/dashboard"
icon = "dashboard"
description = "Overview metrics, quick actions & executive summary"

[[menus]]
key = "notes"
label = "Notes"
href = "/"
icon = "notes"
description = "Encrypted personal notes vertical slice"

[[menus]]
key = "table"
label = "Table"
href = "/table"
icon = "table"
description = "High-performance data grid, sorting & pagination"

[[menus]]
key = "form"
label = "Form"
href = "/form"
icon = "form"
description = "Multi-step data entry, validation & rich input controls"

[[menus]]
key = "cards"
label = "Cards"
href = "/cards"
icon = "cards"
description = "Entity catalog, badge statuses & card views"

[[menus]]
key = "analytics"
label = "Analytics"
href = "/analytics"
icon = "analytics"
description = "Progress bars, telemetry stats & visual indicators"

[[menus]]
key = "landing"
label = "Landing"
href = "/landing"
icon = "landing"
description = "Public landing page presentation & features"

[[menus]]
key = "blog"
label = "Blog"
href = "/blog"
icon = "blog"
description = "Technical articles, guides & release announcements"

[[menus]]
key = "changelog"
label = "Changelog"
href = "/changelog"
icon = "changelog"
description = "Release history, roadmap & update notes"

[[menus]]
key = "docs"
label = "Docs"
href = "/docs"
icon = "docs"
description = "Framework & developer documentation"

[billing]
enabled = true
product_code = "CAFRAMEWORK"
gcc_base_url = "http://127.0.0.1:8888"
offline_days = 7
refresh_hours = 6
currencies = ["IDR", "USD"]

[[billing.public_keys]]
kid = "gcc-2026-10"

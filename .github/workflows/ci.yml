# CI workflow for CAFramework v0.1.0 (task.md v3.0 / A-08)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-ci:
    name: Linux Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo registry and build targets
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run local CI gate
        run: |
          chmod +x scripts/ci-local.sh
          ./scripts/ci-local.sh

  windows-ci:
    name: Windows Verification Gate (A-08)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - name: Cache cargo registry and build targets
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: VS-R subset (Windows)
        run: |
          cargo build --workspace --exclude caf-app --all-targets
          cargo clippy --workspace --all-targets --exclude caf-app -- -D warnings
          cargo test --workspace --exclude caf-app

      - name: VS-A check (Windows)
        run: |
          cargo check -p caf-app

[package]
name = "caf-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CAFramework v2 desktop shell — thin Tauri binding layer over caf-core. No business logic here (K2-1)."

[lib]
name = "caf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = [
    "mod-profiles",
    "mod-ai",
    "mod-ai-advanced",
    "mod-pro",
    "mod-feedback",
    "mod-updater",
    "mod-crash",
    "mod-integrations",
    "mod-scheduler",
]

mod-profiles = ["caf-core/mod-profiles"]
mod-ai = ["caf-core/mod-ai"]
mod-ai-advanced = ["caf-core/mod-ai-advanced", "mod-ai"]
mod-pro = ["caf-core/mod-pro", "mod-integrations"]
mod-feedback = ["caf-core/mod-feedback"]
mod-updater = ["caf-core/mod-updater"]
mod-crash = ["caf-core/mod-crash"]
mod-integrations = ["caf-core/mod-integrations"]
mod-scheduler = ["caf-core/mod-scheduler"]
mod-support-page = ["caf-core/mod-support-page"]
mod-background = ["caf-core/mod-background"]
builder = ["caf-core/builder"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
caf-core = { path = "../caf-core", version = "=0.1.0-dev" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1.92"
parking_lot = "0.12.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tauri-plugin-dialog = "2.7.3"
mimalloc = { version = "0.1", default-features = false }
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
ts-rs = "12.0.1"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2.0.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", default-features = false }
